<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // 🌓 描画前にテーマを確定させ、ちらつきを防止する（item/index.html等と同一ロジック）
    (function () {
      try {
        var saved = localStorage.getItem('sky_app_theme');
        var isDark = (saved === 'light' || saved === 'dark') ? (saved === 'dark') : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <title>tai-hub（試作）</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/chrome.css">
  <link rel="stylesheet" href="css/item.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</head>
<body>
  <div id="dock-root"></div>
  <main id="app-root"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
